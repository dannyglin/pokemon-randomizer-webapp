server {
    listen 80;
    server_name _;

    # Large uploads (3DS ROMs can approach 4GB) — actual enforcement of the
    # per-tier size limits happens in the API, this just needs to not
    # truncate the request before it gets there.
    client_max_body_size 4200M;

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
    }

    # Vite content-hashes these filenames (index-<hash>.js), so a given
    # filename's content never changes — safe to cache indefinitely.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references those hashed filenames, so it MUST be
    # revalidated on every load — otherwise browsers can keep serving a
    # stale index.html that points at an old (or now-missing) bundle
    # indefinitely, hiding new deploys behind a silent cache.
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
