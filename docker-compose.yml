services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 50m

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - JOB_DATA_DIR=/data/jobs
      - PORT=3001
      - JOB_RETENTION_HOURS=${JOB_RETENTION_HOURS:-24}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-67108864}
      - RATE_LIMIT_JOBS_PER_HOUR=${RATE_LIMIT_JOBS_PER_HOUR:-5}
    volumes:
      - job-data:/data/jobs
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-200m}

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - JOB_DATA_DIR=/data/jobs
      - JOB_RETENTION_HOURS=${JOB_RETENTION_HOURS:-24}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      - JOB_TIMEOUT_MS=${JOB_TIMEOUT_MS:-600000}
      - JAVA_HEAP_MB=${JAVA_HEAP_MB:-384}
      - RANDOMIZER_JAR_PATH=/opt/randomizer/PokeRandoZX.jar
      - SETTINGS_SHIM_JAR_PATH=/opt/randomizer/settings-shim.jar
    volumes:
      - job-data:/data/jobs
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-600m}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          memory: 50m

volumes:
  redis-data:
  job-data:
