server {
    listen 80;
    server_name _;

    # Gen 1-5 ROMs are small; generous headroom over the API's own 64MB
    # default is still fine since the API enforces the real limit.
    client_max_body_size 100M;

    # Docker's embedded DNS (127.0.0.11) re-resolves "api" whenever its
    # container is recreated and gets a new internal IP. A plain
    # `proxy_pass http://api:3001` resolves once at config load and caches
    # that IP forever, so nginx keeps proxying to a dead container after any
    # redeploy/restart of api until nginx itself restarts. Routing through a
    # variable forces proxy_pass to re-resolve via this resolver instead.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # No URI on the variable target is deliberate: with a variable,
        # nginx can't do its usual compile-time prefix substitution, but
        # omitting the URI entirely makes it forward the client's original
        # request URI unchanged (documented nginx behavior) — which is
        # exactly right here since Express's routes already expect the
        # full "/api/..." path.
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
    }

    # Vite content-hashes these filenames (index-<hash>.js), so a given
    # filename's content never changes — safe to cache indefinitely.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references those hashed filenames, so it MUST be
    # revalidated on every load — otherwise browsers can keep serving a
    # stale index.html that points at an old (or now-missing) bundle
    # indefinitely, hiding new deploys behind a silent cache.
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
